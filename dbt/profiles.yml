# This file is committed on purpose: it holds no secret. Every value that is
# private is read from an environment variable at run time, so the repository
# documents the shape of the connection without carrying the connection itself.
#
# Set these before running dbt (see .env.example):
#   DATABRICKS_HOST       dbc-xxxxxxxx.cloud.databricks.com   (no https://)
#   DATABRICKS_HTTP_PATH  /sql/1.0/warehouses/xxxxxxxxxxxx
#   DATABRICKS_TOKEN      a personal access token

energy_lakehouse:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: energy
      schema: silver
      threads: 4
