# Descriptions for the gold models. They live here rather than in the SQL
# because every run is a CREATE OR REPLACE TABLE, which drops the comments
# Unity Catalog holds; persist_docs in dbt_project.yml writes these back after
# each build, so the documentation survives the run that would erase it.
#
# Data tests belong in a17 and are deliberately absent here.

version: 2

models:
  - name: hourly_market
    description: >
      One row per hour: the day-ahead price, the generation mix, net exports and
      the country-level weather, joined on the hour. This is the table the
      dashboard reads. The weather join is LEFT, so an hour with power but no
      weather is kept with has_weather false rather than dropped.
    columns:
      - name: hour_start_utc
        description: Start of the hour in UTC. The grain of this table and its unique key.
        data_tests:
          - not_null
          - unique
      - name: hour_start_berlin
        description: >
          The same instant as a Europe/Berlin wall-clock timestamp. Two hours
          share a label on the October changeover and one label is missing in
          March; hour_start_utc is the key for exactly that reason.
      - name: date_berlin
        description: Berlin calendar date of the hour, for grouping a day the way a reader means it.
      - name: hour_of_day_berlin
        description: Berlin hour of day, 0 to 23, for an hour-of-day profile.

      - name: day_ahead_price_eur_mwh
        description: >
          Wholesale day-ahead price for the Germany/Luxembourg market area in
          EUR/MWh, not a retail tariff. Null where SMARD has not published the
          hour yet; negative values are normal and are not errors.
        # Section 5 of the problem statement: -500 to 4000 EUR/MWh. This is a
        # plausibility test, not a structural one. It does not fail when this
        # project's code is wrong; it fails when SMARD changes what it publishes -
        # a unit switched to kWh, or a new sentinel in place of a null. That kind
        # of change loads perfectly and makes every chart wrong by a factor of a
        # thousand, with nothing else in the pipeline objecting.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -500
                max_value: 4000
                inclusive: true
      - name: grid_load_mwh
        description: Realised grid load for the hour in MWh, SMARD series 410.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: renewable_mwh
        description: >
          Sum of the six renewable generation series for the hour in MWh.
          Trustworthy only where mix_is_complete is true.
      - name: conventional_mwh
        description: >
          Sum of the five conventional generation series for the hour in MWh.
          Trustworthy only where mix_is_complete is true.
      - name: generation_mwh
        description: >
          renewable_mwh plus conventional_mwh. Null when either side is null, so
          that an hour with a partial mix reports no total at all.

      - name: wind_onshore_mwh
        description: Realised onshore wind generation for the hour in MWh, SMARD series 4067.
      - name: wind_offshore_mwh
        description: Realised offshore wind generation for the hour in MWh, SMARD series 1225.
      - name: solar_pv_mwh
        description: Realised photovoltaic generation for the hour in MWh, SMARD series 4068.
      - name: wind_solar_mwh
        description: >
          Combined wind and solar output for the hour in MWh. This is what the
          headline number splits into quartiles.

      - name: renewable_share
        description: >
          renewable_mwh divided by generation_mwh, 0 to 1. A share of generation,
          not of consumption: it can exceed the share of load in an export hour.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
      - name: wind_solar_share
        description: >
          wind_solar_mwh divided by generation_mwh, 0 to 1. The x-axis of the
          main chart.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true

      - name: net_exports_mwh
        description: >
          generation_mwh minus grid_load_mwh. This difference is dominated by
          cross-border trade, so it is labelled net exports and never as wasted
          energy.

      - name: renewable_series_realised
        description: How many of the six renewable series actually had a value in this hour.
      - name: conventional_series_realised
        description: How many of the five conventional series actually had a value in this hour.
      - name: mix_is_complete
        description: >
          True when every generation series the series_lookup seed names had a
          value in this hour. The counts it compares against are read from the
          seed, not written in the SQL, so adding a series cannot leave this
          flag quietly wrong.
        data_tests:
          - not_null

      - name: has_price
        description: >
          False where SMARD has padded the hour ahead of publication. The
          headline number filters on this; the mix charts do not need to.
      - name: is_cheap_or_negative_price
        description: >
          Price at or below zero. The subject of supporting view 3, not a value
          to be filtered out. Null where the price is null.

      - name: has_weather
        description: >
          False for the hours where power data exists and the DWD station data
          does not. These hours keep their price and mix; only the weather
          columns are null.
      - name: wind_speed_ms_avg
        description: Unweighted mean wind speed across the reporting stations, m/s.
      - name: wind_direction_deg_avg
        description: >
          Vector mean wind direction across the reporting stations, 0 to 360
          degrees. Averaged as unit vectors, because the arithmetic mean of 350
          and 10 is due south.
      - name: sunshine_minutes_avg
        description: Unweighted mean sunshine duration across the reporting stations, minutes per hour.
      - name: wind_is_reliable
        description: >
          True when at least min_stations of the eight stations reported wind.
          An average over two coastal stations is not Germany.
      - name: sunshine_is_reliable
        description: >
          True when at least min_stations of the eight stations reported
          sunshine. Separate from wind_is_reliable because one hour can have
          eight wind stations and five sunshine stations.

      - name: fetched_at
        description: >
          Latest fetch time among the silver rows behind this hour. Lineage, not
          business data.

  - name: price_by_renewable_quartile
    description: >
      The headline number of the project, as four rows. Hours in the window are
      split into quartiles by combined wind and solar output; each row says what
      the price did in that quartile. The window is the last headline_days days
      of data the table holds, anchored on its newest Berlin day rather than on
      today, and the bounds it resolved to are published as columns so the
      number cannot be quoted without the period it describes.
    columns:
      - name: quartile
        description: >
          1 to 4, by combined wind and solar output. 1 is the lowest-output
          quarter of hours and 4 the highest. The grain of this table.
        data_tests:
          - not_null
          - unique
          # ntile(4) cannot produce a fifth quartile, but it produces FEWER than
          # four if the window ever holds fewer than four hours - and a headline
          # built from two quartiles would still render perfectly.
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
                quote: false
      - name: hours
        description: >
          Hours in this quartile. Only hours with a published price and a
          complete generation mix are included, so the four values sum to
          hours_in_window and not to the hours in the calendar window.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1

      - name: wind_solar_mwh_min
        description: Lowest combined wind and solar output in the quartile; its lower boundary.
      - name: wind_solar_mwh_avg
        description: Mean combined wind and solar output in the quartile, MWh.
      - name: wind_solar_mwh_max
        description: Highest combined wind and solar output in the quartile; its upper boundary.

      - name: day_ahead_price_eur_mwh_avg
        description: >
          Mean day-ahead wholesale price in the quartile, EUR/MWh. Wholesale,
          not a retail tariff.
      - name: price_eur_mwh_vs_bottom_quartile
        description: >
          This quartile's mean price minus quartile 1's. Zero on quartile 1 by
          construction; the value on quartile 4 is the headline number. Computed
          here rather than in the dashboard so that "cheaper" has one definition.

      - name: renewable_share_avg
        description: Mean renewable share of generation in the quartile, 0 to 1.
      - name: wind_speed_ms_avg
        description: >
          Mean of the country-level wind speed over the hours in this quartile
          that have weather data. Its denominator is hours_with_weather, not
          hours.
      - name: hours_with_weather
        description: >
          How many hours in the quartile had DWD data. Published because it is
          the denominator of wind_speed_ms_avg.

      - name: cheap_or_negative_hours
        description: Hours in the quartile with a price at or below zero.
      - name: cheap_or_negative_share
        description: cheap_or_negative_hours divided by hours, 0 to 1.

      - name: window_start_berlin
        description: First Berlin date in the window, inclusive.
      - name: window_end_berlin
        description: >
          Last Berlin date in the window, inclusive. This is the newest day the
          hourly table holds, not today: a pipeline that stopped loading would
          otherwise shrink the window and leave the headline looking healthy.
      - name: window_days
        description: The headline_days variable, repeated on every row so the window is self-describing.
      - name: hours_in_window
        description: >
          Hours across all four quartiles. Compare with window_days times 24 to
          see how many hours the price and mix filters removed.

  - name: dashboard_hours
    description: >
      hourly_market with window membership added, and the only place the
      dashboard's date windows are defined. Every column of hourly_market passes
      through unchanged; the three added here say which window an hour falls in
      and what the windows were anchored on. A view, not a table, because it
      holds no facts of its own - resolving the windows once is the whole point,
      so that the main chart cannot plot a different 90 days than the headline
      number printed beneath it describes.
    columns:
      - name: latest_day
        description: >
          The newest Berlin date in hourly_market, and the anchor both windows
          are measured back from. Published rather than hidden: an anchor nobody
          can see is an anchor nobody can question, and a pipeline that stopped
          loading shows up here first.
      - name: in_headline_window
        description: >
          True for the last headline_days Berlin dates, inclusive of both ends.
          The main chart filters on this, so it plots exactly the hours
          price_by_renewable_quartile measured.
      - name: in_recent_window
        description: >
          True for the last recent_days Berlin dates, inclusive of both ends.
          The two seven-day supporting views filter on this. Both views are
          hourly, so this selects about 168 hours and not 7 rows - a daily
          average would erase the shape of the week those views exist to show.

# dashboard_hours deliberately carries no column tests. Every column in it is a column
# of hourly_market, already tested there, and re-asserting them on a view that selects
# from the tested table tests the warehouse rather than the project. The two things
# that ARE new - the window flags - are asserted in
# tests/the_windows_resolve_to_whole_days.sql, because that assertion is about counts
# of distinct days and does not fit a column-level test.
