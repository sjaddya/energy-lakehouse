name: energy_lakehouse
version: "0.1.0"

# Which profile in profiles.yml says where to connect. The catalog and schema
# live there, not here, so the same models can be built against a different
# catalog by changing one file that holds no SQL.
profile: energy_lakehouse

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  energy_lakehouse:
    # Silver is a deterministic function of bronze, so every model is rebuilt in
    # full on each run. This is dbt's default materialisation and it is exactly
    # what the notebooks already did with CREATE OR REPLACE TABLE.
    +materialized: table
    # Every rebuild is a CREATE OR REPLACE TABLE, which drops the table and
    # column comments. persist_docs writes the descriptions in schema.yml back
    # onto Unity Catalog after each run, so the documentation survives the run
    # that would otherwise erase it.
    +persist_docs:
      relation: true
      columns: true

    gold:
      # The profile's schema is silver, because that is where most models live.
      # Gold says where it goes explicitly, and the generate_schema_name macro
      # makes this the literal schema name rather than silver_gold.
      +schema: gold

seeds:
  energy_lakehouse:
    # Lookups are not a medallion layer, so they get their own schema. The
    # generate_schema_name macro makes this the literal schema name.
    +schema: reference
    series_lookup:
      +column_types:
        filter_id: int
        series_name: string
        series_group: string
        unit: string
    station_lookup:
      +column_types:
        # Without this, 00183 is read as the number 183 and never joins to
        # anything. The leading zero is part of the id, not formatting.
        station_id: string
        station_name: string
        state: string

# Two numbers the SQL needs that are decisions, not data. They are also defined
# in src/energy_lakehouse/silver.py, which the Python ingestion uses, and
# tests/unit/test_dbt_vars.py fails if the two copies ever disagree.
vars:
  # The six UTC hours DWD did not publish sunshine for before August 2026.
  night_hours_utc: [0, 1, 20, 21, 22, 23]
  # How many of the eight stations an hourly average needs before it may be
  # called reliable. Two coastal stations are not Germany.
  min_stations: 6
  # The window the headline number describes. It has no Python twin because no
  # Python reads it: it is a property of one gold model's claim, and the model
  # publishes the window bounds it resolved to alongside the number.
  headline_days: 90
